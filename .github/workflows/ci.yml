name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate manifests, vendored skills, and hooks
        run: npm test
      - name: Provision pinned generic hostOnly validator
        shell: bash
        run: |
          git clone --no-checkout https://github.com/awebai/oats.git "$RUNNER_TEMP/oats-hostonly-kernel"
          git -C "$RUNNER_TEMP/oats-hostonly-kernel" checkout --detach bb2ba8c9a254edb745913b9c5a9d9b833fda932d
          test "$(git -C "$RUNNER_TEMP/oats-hostonly-kernel" rev-parse HEAD)" = bb2ba8c9a254edb745913b9c5a9d9b833fda932d
          cd "$RUNNER_TEMP/oats-hostonly-kernel"
          npm ci --ignore-scripts --no-audit --no-fund
      - name: Require actual hostOnly refusal and host-local controls
        env:
          OATS_HOST_ONLY_REQUIRED: '1'
          OATS_HOST_ONLY_KERNEL_ROOT: ${{ runner.temp }}/oats-hostonly-kernel
        run: node --test test/claude-channel-host-only.test.mjs test/public-kernel-team-roots.test.mjs test/public-kernel-disposable-home.test.mjs
      - name: Consumer probe status
        run: echo "PENDING(released-0.19.0-fixtures; package-runtime-api.md Consumer fixture) acquire -> lock -> trust -> activate -> spawn"

  # oats aweb resident create against aweb's local stack (postgres, redis, awid
  # and the OSS aweb server, built from aweb at a pinned commit) with the
  # released aw: registration at awid, same-DID resume, the key's absence on a
  # failure, and adopting a resident with a real systemd --user custody unit.
  # aweb Cloud's workspaces/init is not in that stack: a complete create is the
  # joint E2E's (docs/resident-create.md).
  resident-journey:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      AWEB_STACK_COMMIT: 1d7ee6bb3519a3c940ebeb12afc86d921dc13e27
      AW_VERSION: 1.36.33
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check out aweb's local stack at the pinned commit
        shell: bash
        run: |
          git clone --no-checkout https://github.com/awebai/aweb.git "$RUNNER_TEMP/aweb"
          git -C "$RUNNER_TEMP/aweb" checkout --detach "$AWEB_STACK_COMMIT"
          test "$(git -C "$RUNNER_TEMP/aweb" rev-parse HEAD)" = "$AWEB_STACK_COMMIT"
      - name: Start postgres, redis, awid and aweb
        working-directory: ${{ runner.temp }}/aweb
        run: docker compose -f docker-compose.e2e.yml up -d --build --wait postgres redis awid aweb
      - name: Install the released aw in an isolated prefix
        shell: bash
        run: |
          npm install --prefix "$RUNNER_TEMP/aw" --no-audit --no-fund "@awebai/aw@$AW_VERSION"
          "$RUNNER_TEMP/aw/node_modules/.bin/aw" version
      - name: Give the runner a systemd user manager
        shell: bash
        run: |
          sudo loginctl enable-linger "$(id -un)"
          for _ in $(seq 1 30); do test -S "/run/user/$(id -u)/bus" && break; sleep 1; done
          # The journeys need a real systemd --user manager: fail here, plainly,
          # when the runner cannot give one.
          test -d "/run/user/$(id -u)" || { echo "no XDG_RUNTIME_DIR /run/user/$(id -u) after enable-linger"; exit 1; }
          test -S "/run/user/$(id -u)/bus" || { echo "no user bus at /run/user/$(id -u)/bus after enable-linger"; exit 1; }
          loginctl show-user "$(id -un)" --property=Linger | grep -qx 'Linger=yes' || { echo "lingering is not on for $(id -un)"; exit 1; }
          XDG_RUNTIME_DIR="/run/user/$(id -u)" DBUS_SESSION_BUS_ADDRESS="unix:path=/run/user/$(id -u)/bus" systemctl --user show-environment >/dev/null || { echo "systemctl --user cannot reach the user manager"; exit 1; }
          echo "XDG_RUNTIME_DIR=/run/user/$(id -u)" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$(id -u)/bus" >> "$GITHUB_ENV"
      - name: Real-stack resident create journeys
        env:
          OATS_RESIDENT_JOURNEY_REQUIRED: '1'
          OATS_RESIDENT_JOURNEY_AW: ${{ runner.temp }}/aw/node_modules/.bin/aw
          OATS_RESIDENT_JOURNEY_AWEB_URL: http://127.0.0.1:18000
          OATS_RESIDENT_JOURNEY_AWID_URL: http://127.0.0.1:18010
        run: node --test test/resident-journey.test.mjs
      - name: Stack logs
        if: failure()
        working-directory: ${{ runner.temp }}/aweb
        run: docker compose -f docker-compose.e2e.yml logs --tail 200 awid aweb
