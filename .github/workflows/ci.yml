name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  # OATS v0.70.0: the released kernel at the provider's 0.70.0 floor.
  OATS_KERNEL_COMMIT: 7512163012876511088da79168c74540f9523c66

jobs:
  aw-versions:
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.matrix.outputs.versions }}
      floor: ${{ steps.matrix.outputs.floor }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: matrix
        run: |
          echo "floor=$(node --input-type=module -e "import {AW_MIN} from './oats-package/capabilities/oats-aweb/lib/aw-floor.mjs'; console.log(AW_MIN)")" >> "$GITHUB_OUTPUT"
          echo "versions=$(node --input-type=module -e "import {AW_TEST_VERSIONS} from './scripts/aw-test-versions.mjs'; console.log(JSON.stringify(AW_TEST_VERSIONS))")" >> "$GITHUB_OUTPUT"

  aw-contract:
    needs: aw-versions
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        aw: ${{ fromJSON(needs.aw-versions.outputs.versions) }}
    env:
      AW_VERSION: ${{ matrix.aw }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install exactly this released or next aw
        run: |
          npm install --prefix "$RUNNER_TEMP/aw" --no-audit --no-fund "@awebai/aw@$AW_VERSION"
          native="$(node -e 'console.log(require.resolve("@awebai/aw-" + process.platform + "-" + process.arch + "/bin/aw", {paths: [process.argv[1]]}))' "$RUNNER_TEMP/aw")"
          echo "AW_NATIVE_BIN=$native" >> "$GITHUB_ENV"
          installed="$("$RUNNER_TEMP/aw/node_modules/.bin/aw" version)"
          test "${installed%%$'\n'*}" = "aw $AW_VERSION"
          node scripts/check-aw-integrity.mjs "$RUNNER_TEMP/aw" "$AW_VERSION"
      - name: npm test unit and native CLI group, zero skips
        run: |
          mkdir -p "$RUNNER_TEMP/test-home"
          env -i HOME="$RUNNER_TEMP/test-home" PATH="$RUNNER_TEMP/aw/node_modules/.bin:$PATH" \
            AW_NO_UPDATE_CHECK=1 OATS_TEST_AW_VERSION="$AW_VERSION" \
            AW_REAL_CLI_BIN="$AW_NATIVE_BIN" \
            OATS_TEST_AW="$AW_NATIVE_BIN" \
            OATS_AWEB_TEST_AW="$AW_NATIVE_BIN" \
            OATS_GRANT_DURATION_NATIVE_REQUIRED=1 OATS_INVITE_NATIVE_REQUIRED=1 OATS_USERNAME_NATIVE_REQUIRED=1 OATS_ATTRIBUTION_NATIVE_REQUIRED=1 \
            OATS_TEST_AW_ARGV_LOG="$RUNNER_TEMP/recorded-argv.jsonl" \
            node scripts/test-ci.mjs unit
      - name: Every recorded hook command and flag exists in this real aw
        run: node scripts/check-aw-argv.mjs "$AW_NATIVE_BIN" "$RUNNER_TEMP/recorded-argv.jsonl"

  validate-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate manifests, vendored skills, and hooks
        run: npm run validate
      - name: Provision pinned public kernel and tested aw
        run: |
          git clone --no-checkout https://github.com/awebai/oats.git "$RUNNER_TEMP/kernel"
          git -C "$RUNNER_TEMP/kernel" checkout --detach "$OATS_KERNEL_COMMIT"
          test "$(git -C "$RUNNER_TEMP/kernel" rev-parse HEAD)" = "$OATS_KERNEL_COMMIT"
          (cd "$RUNNER_TEMP/kernel" && npm ci --ignore-scripts --no-audit --no-fund)
          version="$(node --input-type=module -e "import {AW_TESTED} from './oats-package/capabilities/oats-aweb/lib/aw-floor.mjs'; console.log(AW_TESTED)")"
          npm install --prefix "$RUNNER_TEMP/aw" --no-audit --no-fund "@awebai/aw@$version"
          native="$(node -e 'console.log(require.resolve("@awebai/aw-" + process.platform + "-" + process.arch + "/bin/aw", {paths: [process.argv[1]]}))' "$RUNNER_TEMP/aw")"
          echo "AW_NATIVE_BIN=$native" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/test-home" "$RUNNER_TEMP/tasks-scratch"
      - name: npm test public kernel group, zero skips
        run: |
          env -i HOME="$RUNNER_TEMP/test-home" PATH="$RUNNER_TEMP/aw/node_modules/.bin:$PATH" \
            OATS_HOST_ONLY_REQUIRED=1 OATS_HOST_ONLY_KERNEL_ROOT="$RUNNER_TEMP/kernel" \
            OATS_PREVIEW_KERNEL_REQUIRED=1 OATS_PREVIEW_KERNEL_ROOT="$RUNNER_TEMP/kernel" \
            OATS_TASKS_KERNEL_ROOT="$RUNNER_TEMP/kernel" OATS_TASKS_SCRATCH_ROOT="$RUNNER_TEMP/tasks-scratch" \
            OATS_AWEB_HEALTH_NATIVE=1 OATS_TEST_AW="$AW_NATIVE_BIN" \
            node scripts/test-ci.mjs kernel
      - name: npm test native host and scheduler group, zero skips
        run: |
          env -i HOME="$RUNNER_TEMP/test-home" PATH="$RUNNER_TEMP/aw/node_modules/.bin:$PATH" \
            OATS_AWEB_HEALTH_NATIVE=1 OATS_PREVIEW_KERNEL_ROOT="$RUNNER_TEMP/kernel" \
            OATS_TEST_AW="$AW_NATIVE_BIN" \
            OATS_AWEB_HEALTH_AW="$AW_NATIVE_BIN" \
            node scripts/test-ci.mjs host

  resident-journey:
    needs: aw-versions
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        aw: ${{ fromJSON(needs.aw-versions.outputs.versions) }}
    env:
      AWEB_STACK_COMMIT: 679d50066d4160748f6f9cfa0537161992399573
      AW_VERSION: ${{ matrix.aw }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check out aweb's local stack at the pinned commit
        run: |
          git clone --no-checkout https://github.com/awebai/aweb.git "$RUNNER_TEMP/aweb"
          git -C "$RUNNER_TEMP/aweb" checkout --detach "$AWEB_STACK_COMMIT"
          test "$(git -C "$RUNNER_TEMP/aweb" rev-parse HEAD)" = "$AWEB_STACK_COMMIT"
      - name: Start postgres, redis, awid and aweb
        working-directory: ${{ runner.temp }}/aweb
        run: docker compose -f docker-compose.e2e.yml -f "$GITHUB_WORKSPACE/test/fixtures/stack/awid-public-origin.yaml" up -d --build --wait postgres redis awid aweb
      - name: Provision pinned kernel and exact aw
        run: |
          git clone --no-checkout https://github.com/awebai/oats.git "$RUNNER_TEMP/kernel"
          git -C "$RUNNER_TEMP/kernel" checkout --detach "$OATS_KERNEL_COMMIT"
          test "$(git -C "$RUNNER_TEMP/kernel" rev-parse HEAD)" = "$OATS_KERNEL_COMMIT"
          (cd "$RUNNER_TEMP/kernel" && npm ci --ignore-scripts --no-audit --no-fund)
          npm install --prefix "$RUNNER_TEMP/aw" --no-audit --no-fund "@awebai/aw@$AW_VERSION"
          native="$(node -e 'console.log(require.resolve("@awebai/aw-" + process.platform + "-" + process.arch + "/bin/aw", {paths: [process.argv[1]]}))' "$RUNNER_TEMP/aw")"
          echo "AW_NATIVE_BIN=$native" >> "$GITHUB_ENV"
          installed="$("$RUNNER_TEMP/aw/node_modules/.bin/aw" version)"
          test "${installed%%$'\n'*}" = "aw $AW_VERSION"
          node scripts/check-aw-integrity.mjs "$RUNNER_TEMP/aw" "$AW_VERSION"
      - name: Give the runner a disposable systemd user custody manager
        run: |
          sudo loginctl enable-linger "$(id -un)"
          for _ in $(seq 1 30); do test -S "/run/user/$(id -u)/bus" && break; sleep 1; done
          test -S "/run/user/$(id -u)/bus"
          echo "XDG_RUNTIME_DIR=/run/user/$(id -u)" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$(id -u)/bus" >> "$GITHUB_ENV"
          command -v lsof || sudo apt-get install -y lsof
      - name: Native membership read failures at this aw
        if: ${{ !cancelled() }}
        env:
          OATS_MEMBERSHIP_NATIVE_REQUIRED: '1'
          OATS_AWEB_TEST_AW: ${{ runner.temp }}/aw/node_modules/.bin/aw
        run: node --test test/membership-read-native.test.mjs
      - name: Native setup root choice at this aw
        if: ${{ !cancelled() }}
        env:
          OATS_SETUP_ROOT_NATIVE_REQUIRED: '1'
          OATS_AWEB_TEST_AW: ${{ runner.temp }}/aw/node_modules/.bin/aw
        run: node --test test/setup-root-choice-native.test.mjs
      - name: npm test disposable real-stack group, zero skips
        run: |
          mkdir -p "$RUNNER_TEMP/test-home"
          env -i HOME="$RUNNER_TEMP/test-home" PATH="$RUNNER_TEMP/aw/node_modules/.bin:$PATH" \
            XDG_RUNTIME_DIR="$XDG_RUNTIME_DIR" DBUS_SESSION_BUS_ADDRESS="$DBUS_SESSION_BUS_ADDRESS" \
            OATS_AWEB_CAPTURE_DIR="$RUNNER_TEMP/captures/$AW_VERSION" \
            OATS_AWEB_CAPTURE_STACK_COMMIT="$AWEB_STACK_COMMIT" \
            OATS_AWEB_CAPTURE_KERNEL_COMMIT="$OATS_KERNEL_COMMIT" OATS_AWEB_CAPTURE_PACKAGE_COMMIT="$GITHUB_SHA" \
            AW_VERSION="$AW_VERSION" OATS_RESIDENT_JOURNEY_REQUIRED=1 \
            OATS_RESIDENT_JOURNEY_AW="$AW_NATIVE_BIN" \
            OATS_RESIDENT_JOURNEY_AWEB_URL=http://127.0.0.1:18000 \
            OATS_RESIDENT_JOURNEY_AWID_URL=http://127.0.0.1:18010 \
            OATS_RESIDENT_JOURNEY_KERNEL="$RUNNER_TEMP/kernel" \
            node scripts/test-ci.mjs stack
      - name: Recapture the supported resident baseline with real aw
        if: ${{ !cancelled() && matrix.aw == needs.aw-versions.outputs.floor }}
        run: |
          mkdir -p "$RUNNER_TEMP/captures/resident"
          env -i HOME="$RUNNER_TEMP/test-home" PATH="$RUNNER_TEMP/aw/node_modules/.bin:$PATH" \
            AWEB_URL=http://127.0.0.1:18000 AWID_REGISTRY_URL=http://127.0.0.1:18010 \
            bash test/fixtures/resident/capture.sh "$AW_NATIVE_BIN" "$RUNNER_TEMP/resident-capture" "$RUNNER_TEMP/captures/resident"
      - name: Refuse private material and sanitize capture paths
        id: sanitize
        if: ${{ always() }}
        run: node scripts/sanitize-captures.mjs "$RUNNER_TEMP/captures"
      - name: Upload sanitized native captures for author inspection
        if: ${{ always() && steps.sanitize.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: aw-captures-${{ matrix.aw }}
          path: ${{ runner.temp }}/captures
          if-no-files-found: error
      - name: Stack logs
        if: failure()
        working-directory: ${{ runner.temp }}/aweb
        run: docker compose -f docker-compose.e2e.yml logs --tail 200 awid aweb
