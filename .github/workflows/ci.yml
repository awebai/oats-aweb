name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Release pin: the OATS v0.68.1 release commit (tag v0.68.1). It reports
# 0.68.1, which satisfies oats.aweb's floor of OATS >=0.68.0.
env:
  OATS_KERNEL_COMMIT: 13f8f133808f5932bf461108703c1bada4b3f3d3

jobs:
  validate-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The upgrade fixture reads v1.17.1 and v1.31.0 locally; tests never fetch tags.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The aw-verb guard (test/oats-aweb.test.mjs) checks every aw verb the
      # guidance names against a real aw, and fails here rather than skip. The
      # aw is the one the provider is tested with (AW_TESTED), in an isolated
      # prefix on this step's PATH only.
      - name: Install the tested aw
        shell: bash
        run: |
          version="$(node --input-type=module -e "import {AW_TESTED} from './oats-package/capabilities/oats-aweb/lib/aw-floor.mjs'; console.log(AW_TESTED)")"
          npm install --prefix "$RUNNER_TEMP/aw" --no-audit --no-fund "@awebai/aw@$version"
          installed="$("$RUNNER_TEMP/aw/node_modules/.bin/aw" version)"
          echo "$installed"
          test "${installed%%$'\n'*}" = "aw $version"
      - name: Validate manifests, vendored skills, and hooks
        shell: bash
        env:
          OATS_AW_VERBS_REQUIRED: '1'
        run: PATH="$RUNNER_TEMP/aw/node_modules/.bin:$PATH" npm test
      - name: Provision pinned generic hostOnly validator
        shell: bash
        run: |
          git clone --no-checkout https://github.com/awebai/oats.git "$RUNNER_TEMP/oats-hostonly-kernel"
          git -C "$RUNNER_TEMP/oats-hostonly-kernel" checkout --detach "$OATS_KERNEL_COMMIT"
          test "$(git -C "$RUNNER_TEMP/oats-hostonly-kernel" rev-parse HEAD)" = "$OATS_KERNEL_COMMIT"
          cd "$RUNNER_TEMP/oats-hostonly-kernel"
          npm ci --ignore-scripts --no-audit --no-fund
      - name: Require actual hostOnly refusal and host-local controls
        env:
          OATS_HOST_ONLY_REQUIRED: '1'
          OATS_HOST_ONLY_KERNEL_ROOT: ${{ runner.temp }}/oats-hostonly-kernel
        run: node --test test/claude-channel-host-only.test.mjs test/public-kernel-team-roots.test.mjs test/public-kernel-disposable-home.test.mjs test/public-kernel-seat-registry.test.mjs
      - name: Provision pinned launch-preview kernel
        shell: bash
        run: |
          git clone --no-checkout https://github.com/awebai/oats.git "$RUNNER_TEMP/oats-preview-kernel"
          git -C "$RUNNER_TEMP/oats-preview-kernel" checkout --detach "$OATS_KERNEL_COMMIT"
          test "$(git -C "$RUNNER_TEMP/oats-preview-kernel" rev-parse HEAD)" = "$OATS_KERNEL_COMMIT"
          cd "$RUNNER_TEMP/oats-preview-kernel"
          npm ci --ignore-scripts --no-audit --no-fund
      - name: Require the decision statement in a real start preview
        env:
          OATS_PREVIEW_KERNEL_REQUIRED: '1'
          OATS_PREVIEW_KERNEL_ROOT: ${{ runner.temp }}/oats-preview-kernel
        run: node --test test/public-kernel-launch-preview.test.mjs test/public-kernel-codex-delivery.test.mjs
      - name: Require historical package upgrade and next-start renewal
        env:
          OATS_PREVIEW_KERNEL_REQUIRED: '1'
          OATS_PREVIEW_KERNEL_ROOT: ${{ runner.temp }}/oats-preview-kernel
        run: node --test test/public-kernel-upgrade.test.mjs
      - name: Require real kernel unread-delivery attention claims
        env:
          OATS_AWEB_HEALTH_NATIVE: '1'
          OATS_PREVIEW_KERNEL_ROOT: ${{ runner.temp }}/oats-preview-kernel
        run: node --test test/unread-attention-native.test.mjs
      # Human attribution (spec human-ids-acxy7): the protected aw commands are
      # checked against aw built from aweb 44158f1bb, the commit the spec pins
      # until a published aw carries them, and a spawn refusal is checked
      # through a real kernel that lists spawn-attribution (OATS v0.69.19).
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.11'
          cache: false
      - name: Build aw from aweb 44158f1bb (the protected client)
        shell: bash
        env:
          AWEB_PROTECTED_COMMIT: 44158f1bb95f887e86dd039757f64f9b50a428bf
        run: |
          git clone --no-checkout https://github.com/awebai/aweb.git "$RUNNER_TEMP/aweb-protected"
          git -C "$RUNNER_TEMP/aweb-protected" checkout --detach "$AWEB_PROTECTED_COMMIT"
          test "$(git -C "$RUNNER_TEMP/aweb-protected" rev-parse HEAD)" = "$AWEB_PROTECTED_COMMIT"
          cd "$RUNNER_TEMP/aweb-protected/cli/go"
          go build -ldflags "-X main.version=1.36.59-rc.2+44158f1" -o "$RUNNER_TEMP/aw-protected/aw" ./cmd/aw
          "$RUNNER_TEMP/aw-protected/aw" version
      - name: Provision the spawn-attribution kernel
        shell: bash
        env:
          OATS_ATTRIBUTION_KERNEL_COMMIT: 09657344d48893c532aa408a36b12ffc0a72dcc8
        run: |
          git clone --no-checkout https://github.com/awebai/oats.git "$RUNNER_TEMP/oats-attribution-kernel"
          git -C "$RUNNER_TEMP/oats-attribution-kernel" checkout --detach "$OATS_ATTRIBUTION_KERNEL_COMMIT"
          test "$(git -C "$RUNNER_TEMP/oats-attribution-kernel" rev-parse HEAD)" = "$OATS_ATTRIBUTION_KERNEL_COMMIT"
          cd "$RUNNER_TEMP/oats-attribution-kernel"
          npm ci --ignore-scripts --no-audit --no-fund
      - name: Require the protected aw's --help check and the real-kernel attribution spawn
        env:
          OATS_AWEB_PROTECTED_AW_REQUIRED: '1'
          OATS_AWEB_PROTECTED_AW: ${{ runner.temp }}/aw-protected/aw
          OATS_ATTRIBUTION_KERNEL_REQUIRED: '1'
          OATS_ATTRIBUTION_KERNEL_ROOT: ${{ runner.temp }}/oats-attribution-kernel
        run: node --test test/protected-aw-argv.test.mjs test/attribution-kernel-spawn.test.mjs
      - name: Consumer probe status
        run: echo "PENDING(released-0.19.0-fixtures; package-runtime-api.md Consumer fixture) acquire -> lock -> trust -> activate -> spawn"

  # oats aweb resident create against aweb's local stack (postgres, redis, awid
  # and the OSS aweb server, built from aweb at a pinned commit) with the
  # released aw and a real OATS kernel: registration at awid, same-DID resume,
  # the key's absence on a failure, adopting a resident with a real systemd
  # --user custody unit, and its printed next steps run as printed, through a
  # seat's real grant and its retire. aweb Cloud's workspaces/init is not in
  # that stack: a complete create is the joint E2E's (docs/resident-create.md).
  resident-journey:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        # Exactly [min, tested] from oats-package/capabilities/oats-aweb/aw-compat.json,
        # in that order; test/health-aw-floor.test.mjs fails when they differ.
        aw: ['1.36.33', '1.36.58']
    env:
      # aweb's release of aw 1.36.58 (tag aw-v1.36.58), server 1.27.50 and awid
      # 0.5.39: the tested aw runs against the server it was released with.
      AWEB_STACK_COMMIT: 679d50066d4160748f6f9cfa0537161992399573
      AW_VERSION: ${{ matrix.aw }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check out aweb's local stack at the pinned commit
        shell: bash
        run: |
          git clone --no-checkout https://github.com/awebai/aweb.git "$RUNNER_TEMP/aweb"
          git -C "$RUNNER_TEMP/aweb" checkout --detach "$AWEB_STACK_COMMIT"
          test "$(git -C "$RUNNER_TEMP/aweb" rev-parse HEAD)" = "$AWEB_STACK_COMMIT"
      - name: Start postgres, redis, awid and aweb
        working-directory: ${{ runner.temp }}/aweb
        run: docker compose -f docker-compose.e2e.yml up -d --build --wait postgres redis awid aweb
      - name: Provision the conditional-default kernel
        shell: bash
        run: |
          git clone --no-checkout https://github.com/awebai/oats.git "$RUNNER_TEMP/conditional-default-kernel"
          git -C "$RUNNER_TEMP/conditional-default-kernel" checkout --detach "$OATS_KERNEL_COMMIT"
          test "$(git -C "$RUNNER_TEMP/conditional-default-kernel" rev-parse HEAD)" = "$OATS_KERNEL_COMMIT"
          cd "$RUNNER_TEMP/conditional-default-kernel"
          npm ci --ignore-scripts --no-audit --no-fund
      # The job fails unless the aw installed is exactly its matrix entry, so an
      # npm resolution to another version never passes as that entry.
      - name: Install the released aw in an isolated prefix
        shell: bash
        run: |
          npm install --prefix "$RUNNER_TEMP/aw" --no-audit --no-fund "@awebai/aw@$AW_VERSION"
          installed="$("$RUNNER_TEMP/aw/node_modules/.bin/aw" version)"
          echo "$installed"
          test "${installed%%$'\n'*}" = "aw $AW_VERSION"
      # The journeys below run even when this step fails, so a red real-aw
      # step never hides whether the resident journeys still pass.
      - name: Real-aw tests at this version
        shell: bash
        run: |
          PATH="$RUNNER_TEMP/aw/node_modules/.bin:$PATH" node --test --test-reporter=tap --test-name-pattern='real aw|published aw' test/oats-aweb-1-14.test.mjs test/oats-aweb-1-15.test.mjs | tee "$RUNNER_TEMP/real-aw.tap"
          grep -q '^# skipped 0$' "$RUNNER_TEMP/real-aw.tap"
      # aw-byot-create-shapes' real-aw tests check the captured `aw id team`
      # shapes against the binary. They need aw 1.36.56 or later, so they run
      # on the tested leg only (AW_TESTED, as the validate job reads it), and
      # fail there when any is skipped or fewer than its three ran.
      - name: Real-aw BYOT create shapes at the tested aw
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          tested="$(node --input-type=module -e "import {AW_TESTED} from './oats-package/capabilities/oats-aweb/lib/aw-floor.mjs'; console.log(AW_TESTED)")"
          if [ "$AW_VERSION" != "$tested" ]; then echo "aw $AW_VERSION is not the tested aw $tested; the BYOT create shapes run on that leg"; exit 0; fi
          OATS_AWEB_TEST_AW="$RUNNER_TEMP/aw/node_modules/.bin/aw" node --test --test-reporter=tap test/aw-byot-create-shapes.test.mjs | tee "$RUNNER_TEMP/byot-shapes.tap"
          grep -q '^# skipped 0$' "$RUNNER_TEMP/byot-shapes.tap"
          test "$(grep -c '^ok [0-9]* - real aw: ' "$RUNNER_TEMP/byot-shapes.tap")" -eq 3
      - name: Give the runner a systemd user manager
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          sudo loginctl enable-linger "$(id -un)"
          for _ in $(seq 1 30); do test -S "/run/user/$(id -u)/bus" && break; sleep 1; done
          # The journeys need a real systemd --user manager: fail here, plainly,
          # when the runner cannot give one.
          test -d "/run/user/$(id -u)" || { echo "no XDG_RUNTIME_DIR /run/user/$(id -u) after enable-linger"; exit 1; }
          test -S "/run/user/$(id -u)/bus" || { echo "no user bus at /run/user/$(id -u)/bus after enable-linger"; exit 1; }
          loginctl show-user "$(id -un)" --property=Linger | grep -qx 'Linger=yes' || { echo "lingering is not on for $(id -un)"; exit 1; }
          XDG_RUNTIME_DIR="/run/user/$(id -u)" DBUS_SESSION_BUS_ADDRESS="unix:path=/run/user/$(id -u)/bus" systemctl --user show-environment >/dev/null || { echo "systemctl --user cannot reach the user manager"; exit 1; }
          echo "XDG_RUNTIME_DIR=/run/user/$(id -u)" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$(id -u)/bus" >> "$GITHUB_ENV"
      - name: Make lsof available, so the journeys prove the socket-owner check
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          command -v lsof || { echo "lsof missing; installing it on this runner"; sudo apt-get install -y lsof; }
          command -v lsof
      - name: Real-stack resident create journeys
        if: ${{ !cancelled() }}
        env:
          OATS_RESIDENT_JOURNEY_REQUIRED: '1'
          OATS_RESIDENT_JOURNEY_AW: ${{ runner.temp }}/aw/node_modules/.bin/aw
          OATS_RESIDENT_JOURNEY_AWEB_URL: http://127.0.0.1:18000
          OATS_RESIDENT_JOURNEY_AWID_URL: http://127.0.0.1:18010
          OATS_RESIDENT_JOURNEY_KERNEL: ${{ runner.temp }}/conditional-default-kernel
        run: node --test test/resident-journey.test.mjs
      - name: Stack logs
        if: failure()
        working-directory: ${{ runner.temp }}/aweb
        run: docker compose -f docker-compose.e2e.yml logs --tail 200 awid aweb
